<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
  }

  .main {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap-box{
    width: 200px;
    height: 200px;
    position: relative;
  }

  .wrap {
    width: 200px;
    height: 200px;
    background-image: url('../img/cricyle.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    transform: rotateZ(0deg);
    animation: wrapCycle 3s linear infinite alternate;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .box {
    width: 100px;
    height: 100px;
    position: absolute;
    left: 50px;
    top: 50px;
    background-image: url('../img/robot.png');
    background-size: 100% 100%;
  }

  .tip{
    text-align: center;
    margin-top: 10px;
    color: #BCBCBC;
    font-size: 13px;
  }

  @keyframes wrapCycle {
    0% {
      transform: rotateZ(0deg)
    }

    100% {
      transform: rotateZ(360deg)
    }
  }
</style>

<body>
  <div class="main">
    <div class="wrap-box">
      <div class="wrap">
      </div>
      <div class="box">

      </div>
      <div class="tip">
        服务器连接中...
      </div>
    </div>

  </div>
</body>

</html>
